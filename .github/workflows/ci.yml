name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # MinVer computes the package version from the git tags.

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore DynamicAuthorization.slnx

      - name: Build
        run: dotnet build DynamicAuthorization.slnx --configuration Release --no-restore

      # Fails on anything that differs from .editorconfig: whitespace, line endings, the byte-order mark, code style
      # and analyzer warnings. "dotnet format DynamicAuthorization.slnx" fixes what it reports.
      - name: Verify formatting
        run: dotnet format DynamicAuthorization.slnx --verify-no-changes --no-restore

      - name: Test
        run: dotnet test --solution DynamicAuthorization.slnx --configuration Release --no-build

      - name: Pack
        run: dotnet pack DynamicAuthorization.slnx --configuration Release --no-build --output artifacts

      - name: Upload packages
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@v7
        with:
          name: packages
          path: artifacts/
          if-no-files-found: error
          retention-days: 7

  # Publishes the packages of a version tag through Trusted Publishing: GitHub signs a token that names this repository
  # and this workflow, and nuget.org exchanges it for an API key that is valid for an hour, so no secret is stored. The
  # policy on nuget.org names the repository and this file; renaming either needs the policy updated.
  #
  # The job is separate so that only it may request the token. The build job runs the code of pull requests.
  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      id-token: write # lets the job request the token from GitHub
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: packages
          path: artifacts

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Log in to NuGet
        id: login
        uses: NuGet/login@v1
        with:
          user: mo.esmp # the nuget.org profile name that owns the policy, not an email address

      - name: Publish to NuGet
        run: dotnet nuget push "artifacts/*.nupkg" --api-key "$NUGET_API_KEY" --source https://api.nuget.org/v3/index.json --skip-duplicate
        env:
          NUGET_API_KEY: ${{ steps.login.outputs.NUGET_API_KEY }}
